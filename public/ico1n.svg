<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.3" />

  <!-- Grid lines -->
  <path d="M64 256 H448 M256 64 V448" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="8 8" />

  <!-- Shield Boundary -->
  <path d="M256 80 L390 140 V260 C390 350 256 420 256 420 C256 420 122 350 122 260 V140 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#cyanGrad)" 
        stroke-width="6" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Server Rack / Infrastructure Layers -->
  <rect x="166" y="170" width="180" height="34" rx="8" fill="#0f1f38" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="190" cy="187" r="4.5" fill="#22c55e" />
  <circle cx="206" cy="187" r="4.5" fill="#38bdf8" />
  <line x1="230" y1="187" x2="326" y2="187" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />

  <rect x="166" y="218" width="180" height="34" rx="8" fill="#0f1f38" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="190" cy="235" r="4.5" fill="#22c55e" />
  <circle cx="206" cy="235" r="4.5" fill="#f59e0b" />
  <line x1="230" y1="235" x2="326" y2="235" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />

  <rect x="166" y="266" width="180" height="34" rx="8" fill="#0f1f38" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="190" cy="283" r="4.5" fill="#22c55e" />
  <circle cx="206" cy="283" r="4.5" fill="#22c55e" />
  <line x1="230" y1="283" x2="326" y2="283" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />

  <!-- Tech Monogram Accent -->
  <path d="M256 320 C230 320 216 332 216 346 C216 364 240 370 260 376 C284 382 296 390 296 404 C296 418 280 428 256 428" 
        stroke="#22d3ee" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />
</svg>
